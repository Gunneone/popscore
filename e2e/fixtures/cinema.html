<!doctype html>
<html lang="de">
  <head>

    <title>Kinoprogramm (test fixture)</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 40px;
      }
      ul {
        display: flex;
        gap: 24px;
        list-style: none;
        padding: 0;
      }
      li {
        width: 160px;
      }
      img {
        width: 160px;
        height: 240px;
        background: #ccc;
        display: block;
      }
    </style>

  <body>
    <h1>Kinoprogramm</h1>

      <li class="movie">

        />
        <h3>Dune: Part Two (OV)</h3>
        <span>FSK 12 · 166 Min</span> <a href="#">Tickets</a>

      <li class="movie">
        <img
          id="poster-unfassbaren"
          alt="Die Unfassbaren"

        <span>FSK 12 · 135 Min</span> <a href="#">Tickets</a>
      </li>

    <h2>Serien</h2>

      <li class="show">
        <a href="/serie/stranger-things" aria-label="Stranger Things">

            id="tile-show"

            src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
          />
        </a>
      </li>
    </ul>

</html>
